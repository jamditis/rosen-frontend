<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Rosen Archive - Enhanced Data Dashboard</title>
    <meta name="description" content="An interactive dashboard for exploring the Jay Rosen Internet Archive. Filter, chart, and visualize four decades of records." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg" />
    <link rel="icon" href="../../../favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" content="Enhanced data dashboard - Jay Rosen Internet Archive" />
    <meta property="og:description" content="An interactive dashboard for exploring the Jay Rosen Internet Archive. Filter, chart, and visualize four decades of records." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pressthink.org/j/rosen-archive/tools/active/dataviz/dataviz.html" />
    <meta property="og:image" content="https://pressthink.org/j/rosen-archive/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enhanced data dashboard - Jay Rosen Internet Archive" />
    <meta name="twitter:description" content="An interactive dashboard for exploring the Jay Rosen Internet Archive. Filter, chart, and visualize four decades of records." />
    <meta name="twitter:image" content="https://pressthink.org/j/rosen-archive/og-image.png" />
    <!-- Tailwind CSS (pre-built locally; cdn.tailwindcss.com is the JIT dev
         build and cannot carry an integrity hash). See issue #151. -->
    <link rel="stylesheet" href="../tailwind.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"
            integrity="sha384-6kRQDsV2kVYRSENnw7WnekWKCx8/Lmv7rFKpDuR2AoIbjlBShlYcs3x0QlE3kuRh"
            crossorigin="anonymous"></script>
    <!-- Chart.js for data visualization (pinned so the payload can be hashed) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
            integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
            crossorigin="anonymous"></script>
    <!-- Chart.js Treemap Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"
            integrity="sha384-nr2GTsyDh6Kjn1H+dqXUUJpoNTdiOr8swo074Cg0uOwPSRFx27UcVV98yi4LFw3H"
            crossorigin="anonymous"></script>
    <!-- noUiSlider for range slider -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"
            integrity="sha384-/gBUOLHADjY2rp6bHB0IyW9AC28q4OsnirJScje4l1crgYW7Qarx3dH8zcqcUgmy"
            crossorigin="anonymous"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" rel="stylesheet"
          integrity="sha384-PSZaVsyG9jDu8hFaSJev5s/9poIJlX7cuxSGdqCgXRHpo2DzIaZAyCd2rG/DJJmV"
          crossorigin="anonymous">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body { background-color: #f9f6f1 !important; font-family: 'Roboto Mono', monospace !important; color: #2d2d2d; }
        h1, h2, h3, h4, .font-display { font-family: 'Special Elite', cursive !important; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e4e0d8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a89974; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }

        /* Custom styles for the enhanced dashboard */
        .chart-container {
            position: relative;
            height: 40vh;
            min-height: 300px;
        }

        .data-table th {
            cursor: pointer;
            position: relative;
        }

        .data-table th:hover {
            background-color: #f0ebe5;
        }

        .data-table th .sort-arrow {
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        
        .data-table th:hover .sort-arrow {
            opacity: 1;
        }

        .data-table th .sort-arrow.active {
            opacity: 1;
            color: #2d2d2d;
        }

        /* noUiSlider custom styles */
        .noUi-target { background: #e4e0d8; border: 1px solid #c7bca1; box-shadow: none; }
        .noUi-connect { background: #a89974; }
        .noUi-handle { border: 1px solid #2d2d2d; border-radius: 50%; background: #fbf5e8; box-shadow: none; }
        .noUi-handle:after, .noUi-handle:before { display: none; }
        .noUi-pips-horizontal { font-size: 10px; color: #5a5a5a; }
    </style>
</head>
<body class="antialiased">
    <div id="dashboard-wrapper" class="flex flex-col h-full">
        <header class="bg-[#f9f6f1] border-b-2 border-gray-700 flex-shrink-0 p-4">
            <div class="container mx-auto">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 text-center">Enhanced data dashboard</h1>
                <p class="text-center text-gray-600 mt-1">An interactive tool for exploring the Jay Rosen Internet Archive</p>
            </div>
        </header>

        <main class="flex-grow min-h-0">
            <div class="flex flex-col lg:flex-row gap-6 h-full p-4 sm:p-6">
                <!-- Controls sidebar -->
                <aside class="w-full lg:w-80 flex-shrink-0 p-4 bg-gray-50 rounded-lg border overflow-y-auto">
                    <h3 class="font-display text-xl mb-4">Controls and filters</h3>
                    <div class="space-y-6">
                        <div>
                            <label for="dashboard-search" class="block text-sm font-medium text-gray-700 mb-1">Keyword search</label>
                            <input type="text" id="dashboard-search" class="w-full text-sm border-gray-300 rounded-md shadow-sm" placeholder="Filter visualized data...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date range</label>
                            <div id="date-slider" class="mx-2"></div>
                            <div class="flex justify-between text-xs mt-1">
                                <span id="date-slider-start"></span>
                                <span id="date-slider-end"></span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Thematic categories</label>
                            <div id="dashboard-category-filters" class="max-h-40 overflow-y-auto space-y-1 pr-2 mt-1 border p-2 rounded-md bg-white"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Top publications</label>
                            <div id="dashboard-publication-filters" class="max-h-40 overflow-y-auto space-y-1 pr-2 mt-1 border p-2 rounded-md bg-white"></div>
                        </div>
                    </div>
                    <div class="mt-6 pt-6 border-t">
                        <button id="dashboard-reset-filters" class="w-full text-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-600 hover:bg-gray-700">Reset all filters</button>
                        <button id="export-csv-btn" class="w-full text-center mt-2 py-2 px-4 border border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">Export filtered data (CSV)</button>
                    </div>
                </aside>

                <!-- Visualizations and data table -->
                <div class="flex-grow min-w-0 flex flex-col gap-6 overflow-y-auto">
                    <!-- Stat cards -->
                    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
                         <div class="p-4 bg-white rounded-lg border text-center"><p class="text-xs uppercase text-gray-500">Filtered records</p><p id="stat-total-records" class="text-2xl font-bold">--</p></div>
                         <div class="p-4 bg-white rounded-lg border text-center"><p class="text-xs uppercase text-gray-500">Years covered</p><p id="stat-years-covered" class="text-2xl font-bold">--</p></div>
                         <div class="p-4 bg-white rounded-lg border text-center"><p class="text-xs uppercase text-gray-500">Publications</p><p id="stat-publications" class="text-2xl font-bold">--</p></div>
                         <div class="p-4 bg-white rounded-lg border text-center"><p class="text-xs uppercase text-gray-500">Most active year</p><p id="stat-active-year" class="text-2xl font-bold">--</p></div>
                    </section>
                    
                    <!-- Charts -->
                    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-4 rounded-lg border flex flex-col">
                            <h4 class="font-display text-center text-lg flex-shrink-0 mb-2">Thematic focus over time</h4>
                            <div class="chart-container"><canvas id="thematic-focus-chart"></canvas></div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border flex flex-col">
                            <h4 class="font-display text-center text-lg flex-shrink-0 mb-2">Top publications</h4>
                            <div class="chart-container"><canvas id="publications-treemap-chart"></canvas></div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border flex flex-col">
                            <h4 class="font-display text-center text-lg flex-shrink-0 mb-2">Top key concepts</h4>
                            <div class="chart-container"><canvas id="top-concepts-chart"></canvas></div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border flex flex-col">
                            <h4 class="font-display text-center text-lg flex-shrink-0 mb-2">Yearly activity</h4>
                            <div class="chart-container"><canvas id="yearly-activity-chart"></canvas></div>
                        </div>
                    </section>

                    <!-- Data Table -->
                    <section class="bg-white p-4 rounded-lg border">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-2">
                            <h4 class="font-display text-lg">Filtered data records</h4>
                            <div class="flex items-center text-sm self-end sm:self-center">
                                <label for="rows-per-page-select" class="mr-2 whitespace-nowrap">Rows per page:</label>
                                <select id="rows-per-page-select" class="w-full text-sm border-gray-300 rounded-md shadow-sm">
                                    <option value="10" selected>10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                        <div id="data-table-container" class="overflow-x-auto"></div>
                        <div id="table-pagination-controls" class="mt-4 flex flex-col sm:flex-row justify-between items-center text-sm gap-2"></div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- CONFIGURATION ---
            const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-XqQXvMJNaBXVWlmXu1EyOpa_Cc6ur-pklWX1mbrWIFybZjmbE6UTIteSoCSvf0a7j5r8A6earp3H/pub?gid=928818664&single=true&output=csv';
            const ALLOWED_COLUMNS = ['id', 'title', 'publication_date', 'original_publication', 'thematic_categories', 'key_concepts', 'summary', 'verified'];
            const TOP_PUBLICATIONS = ["PressThink", "The Guardian", "Vox", "Los Angeles Times", "The Atlantic", "NPR", "Columbia Journalism Review"];
            const COLOR_PALETTE = ['#e0f2fe', '#dcfce7', '#fef9c3', '#ffe4e6', '#f3e8ff', '#fff7ed', '#e0e7ff', '#d1fae5', '#fee2e2', '#cffafe', '#e5e7eb', '#fbcfe8'];

            // --- DOM ELEMENTS ---
            const searchInput = document.getElementById('dashboard-search');
            const dateSliderEl = document.getElementById('date-slider'), dateSliderStart = document.getElementById('date-slider-start'), dateSliderEnd = document.getElementById('date-slider-end');
            const categoryFilters = document.getElementById('dashboard-category-filters');
            const publicationFilters = document.getElementById('dashboard-publication-filters');
            const resetFiltersBtn = document.getElementById('dashboard-reset-filters');
            const exportCsvBtn = document.getElementById('export-csv-btn');
            // Stats
            const statTotalRecords = document.getElementById('stat-total-records'), statYearsCovered = document.getElementById('stat-years-covered'), statPublications = document.getElementById('stat-publications'), statActiveYear = document.getElementById('stat-active-year');
            // Table
            const dataTableContainer = document.getElementById('data-table-container');
            const tablePaginationControls = document.getElementById('table-pagination-controls');
            const rowsPerPageSelect = document.getElementById('rows-per-page-select');
            
            // --- STATE ---
            const state = {
                allRecords: [],
                dashboardData: [],
                uniqueCategories: [],
                charts: {},
                table: {
                    currentPage: 1,
                    rowsPerPage: 10,
                    sortColumn: 'publication_date',
                    sortDirection: 'desc'
                }
            };
            
            // --- DATA HANDLING & CLEANING ---
            function normalizeHeader(h) { return h.toLowerCase().trim().replace(/[^a-z0-9_]/g, ''); }
            function cleanTitle(t) { if (typeof t !== 'string') return ''; const d = /\s(—|-|\|)/; const m = t.match(d); return m ? t.substring(0, m.index).trim() : t.trim(); }
            function standardizeDate(d) { if (!d || typeof d !== 'string' || !d.trim()) return ''; const dt = new Date(d); if (isNaN(dt.getTime())) return ''; const y = dt.getUTCFullYear(); const m = String(dt.getUTCMonth() + 1).padStart(2, '0'); const day = String(dt.getUTCDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
            function parseAndCleanTags(v) { if (typeof v !== 'string' || !v.trim() || v.trim() === '[]' || v.startsWith('=')) return []; const r = /['"]([^'"]*?)['"]/g; let i = []; let m; while ((m = r.exec(v)) !== null) { if (m[1].length < 100 && !m[1].startsWith('=')) i.push(m[1]); } const c = v.replace(/\[.*?\]/g, '').replace(/['"]/g, ''); const rem = c.split(/[;,]/).map(item => item.trim()).filter(item => item && item.length < 100 && !item.startsWith('=')); return [...new Set([...i, ...rem].map(item => item.trim()).filter(Boolean))]; }
            
            async function fetchData() {
                try {
                    const response = await fetch(csvUrl);
                    if (!response.ok) {
                        throw new Error(`Failed to load archive CSV: HTTP ${response.status}`);
                    }
                    const csvText = await response.text();
                    Papa.parse(csvText, {
                        header: true, skipEmptyLines: true, transformHeader: normalizeHeader,
                        complete: (res) => {
                            if (res.errors.length > 0) { throw new Error('CSV parsing error'); }
                            const cleanedData = res.data
                                .map(raw => {
                                    const f = {};
                                    ALLOWED_COLUMNS.forEach(c => {
                                        const n = normalizeHeader(c);
                                        let v = raw[n] || '';
                                        if (c === 'title') v = cleanTitle(v);
                                        else if (c === 'publication_date') v = standardizeDate(v);
                                        else if (['thematic_categories', 'key_concepts'].includes(c)) v = parseAndCleanTags(v);
                                        f[c] = v;
                                    });
                                    return f;
                                })
                                .filter(rec => rec.verified === 'TRUE' && rec.id && rec.title.trim() !== '' && rec.publication_date.trim() !== '');
                            
                            state.allRecords = cleanedData.map(r => ({...r, year: new Date(r.publication_date).getFullYear()}));
                            const catSet = new Set(state.allRecords.flatMap(rec => rec.thematic_categories));
                            state.uniqueCategories = [...catSet].sort();
                            initializeDashboard();
                        }
                    });
                } catch (err) {
                    console.error("Failed to fetch or process data:", err);
                    dataTableContainer.innerHTML = `<p class="text-red-600">Could not load archive data. Please try again later.</p>`;
                }
            }

            // --- UTILITY ---
            function debounce(func, delay) { let timeout; return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), delay); }; }
            function stringToHash(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; } return Math.abs(h); }

            // --- DASHBOARD INITIALIZATION & UPDATES ---
            function initializeDashboard() {
                const years = [...new Set(state.allRecords.map(r => r.year))].sort();
                const minYear = years[0], maxYear = years[years.length - 1];
                noUiSlider.create(dateSliderEl, { start: [minYear, maxYear], connect: true, step: 1, range: { 'min': minYear, 'max': maxYear }, format: { to: v => Math.round(v), from: v => Math.round(v) } });
                
                const createCheckboxes = (items, container) => { container.innerHTML = items.map(c => `<label class="flex items-center text-sm font-normal"><input type="checkbox" value="${c}" class="h-4 w-4 text-gray-800 border-gray-400 focus:ring-gray-700 rounded"><span class="ml-2">${c}</span></label>`).join(''); };
                createCheckboxes(state.uniqueCategories, categoryFilters);
                createCheckboxes(TOP_PUBLICATIONS, publicationFilters);

                // Add event listeners
                dateSliderEl.noUiSlider.on('update', (values) => { dateSliderStart.textContent = values[0]; dateSliderEnd.textContent = values[1]; });
                dateSliderEl.noUiSlider.on('change', updateDashboard);
                [categoryFilters, publicationFilters].forEach(el => el.addEventListener('change', updateDashboard));
                searchInput.addEventListener('input', debounce(updateDashboard, 300));

                rowsPerPageSelect.addEventListener('change', () => {
                    state.table.rowsPerPage = parseInt(rowsPerPageSelect.value, 10);
                    state.table.currentPage = 1;
                    renderDataTable();
                });

                resetFiltersBtn.addEventListener('click', () => {
                    dateSliderEl.noUiSlider.set([minYear, maxYear]);
                    [...categoryFilters.querySelectorAll('input'), ...publicationFilters.querySelectorAll('input')].forEach(i => i.checked = false);
                    searchInput.value = '';
                    updateDashboard();
                });

                exportCsvBtn.addEventListener('click', exportDataToCSV);

                updateDashboard();
            }
            
            function updateDashboard() {
                const [startYear, endYear] = dateSliderEl.noUiSlider.get();
                const selectedCategories = [...categoryFilters.querySelectorAll('input:checked')].map(el => el.value);
                const selectedPublications = [...publicationFilters.querySelectorAll('input:checked')].map(el => el.value);
                const searchTerm = searchInput.value.toLowerCase().trim();

                state.dashboardData = state.allRecords.filter(r => {
                    const inDateRange = r.year >= startYear && r.year <= endYear;
                    const inCategory = selectedCategories.length === 0 || selectedCategories.some(c => r.thematic_categories.includes(c));
                    const inPublication = selectedPublications.length === 0 || selectedPublications.includes(r.original_publication);
                    const inSearch = searchTerm === '' || (r.title.toLowerCase().includes(searchTerm) || r.summary.toLowerCase().includes(searchTerm) || r.key_concepts.join(' ').toLowerCase().includes(searchTerm));
                    return inDateRange && inCategory && inPublication && inSearch;
                });
                
                updateStatCards();
                updateAllCharts();
                state.table.currentPage = 1; // Reset to first page on filter change
                renderDataTable();
            }

            function updateStatCards() {
                statTotalRecords.textContent = state.dashboardData.length;
                const years = [...new Set(state.dashboardData.map(r => r.year))].sort();
                statYearsCovered.textContent = years.length ? `${years[0]} - ${years[years.length - 1]}` : 'N/A';
                statPublications.textContent = [...new Set(state.dashboardData.map(r => r.original_publication))].length;
                
                const yearCounts = state.dashboardData.reduce((acc, r) => { acc[r.year] = (acc[r.year] || 0) + 1; return acc; }, {});
                const mostActive = Object.entries(yearCounts).sort(([,a],[,b]) => b-a)[0];
                statActiveYear.textContent = mostActive ? mostActive[0] : 'N/A';
            }

            // --- CHARTING FUNCTIONS ---
            function updateAllCharts() {
                updateThematicFocusChart();
                updatePublicationsTreemap();
                updateTopConceptsChart();
                updateYearlyActivityChart();
            }

            const getChartContext = (id) => document.getElementById(id).getContext('2d');
            
            const baseChartOptions = { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } };

            function updateThematicFocusChart() {
                const topCats = Object.entries(state.dashboardData.flatMap(r => r.thematic_categories).reduce((acc, cat) => { acc[cat] = (acc[cat] || 0) + 1; return acc; }, {})).sort(([,a],[,b]) => b-a).slice(0, 5).map(([label]) => label);
                const years = [...new Set(state.dashboardData.map(r => r.year))].sort();
                const datasets = topCats.map((cat, i) => ({
                    label: cat,
                    data: years.map(year => state.dashboardData.filter(r => r.year === year && r.thematic_categories.includes(cat)).length),
                    backgroundColor: COLOR_PALETTE[i % COLOR_PALETTE.length],
                    borderColor: COLOR_PALETTE[i % COLOR_PALETTE.length],
                    tension: 0.1,
                    fill: true,
                }));

                if (state.charts.thematicFocus) state.charts.thematicFocus.destroy();
                state.charts.thematicFocus = new Chart(getChartContext('thematic-focus-chart'), { type: 'line', data: { labels: years, datasets }, options: { ...baseChartOptions, scales: { y: { stacked: true } } } });
            }

            function updatePublicationsTreemap() {
                const pubCounts = state.dashboardData.reduce((acc, r) => { const pub = r.original_publication || "Unknown"; acc[pub] = (acc[pub] || 0) + 1; return acc; }, {});
                const treemapData = Object.entries(pubCounts).map(([pub, count]) => ({ name: pub, value: count }));
                
                if (state.charts.pubTreemap) state.charts.pubTreemap.destroy();
                state.charts.pubTreemap = new Chart(getChartContext('publications-treemap-chart'), {
                    type: 'treemap',
                    data: { 
                        datasets: [{ 
                            tree: treemapData, 
                            key: 'value', 
                            groups: ['name'], 
                            backgroundColor: (ctx) => {
                                // If the context has a raw value with a group name (the publication name), calculate the color from that name.
                                if (ctx.raw?.g) {
                                    const publicationName = ctx.raw.g;
                                    return COLOR_PALETTE[stringToHash(publicationName) % COLOR_PALETTE.length];
                                }
                                // Otherwise, return a default color.
                                return 'grey';
                            }, 
                            labels: { display: true, formatter: (c) => c.raw.g } 
                        }] 
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { title: () => '', label: (c) => `${c.raw.g}: ${c.raw.v} articles` } } } }
                });
            }

            function updateTopConceptsChart() {
                const conceptCounts = Object.entries(state.dashboardData.flatMap(r => r.key_concepts).reduce((acc, c) => { acc[c] = (acc[c] || 0) + 1; return acc; }, {})).sort(([,a],[,b]) => b-a).slice(0, 10);
                const labels = conceptCounts.map(([label]) => label);
                const data = conceptCounts.map(([,count]) => count);

                if (state.charts.topConcepts) state.charts.topConcepts.destroy();
                state.charts.topConcepts = new Chart(getChartContext('top-concepts-chart'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Mentions', data, backgroundColor: COLOR_PALETTE }] },
                    options: { ...baseChartOptions, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { y: { ticks: { font: { size: 10 } } } } }
                });
            }

            function updateYearlyActivityChart() {
                const yearCounts = state.dashboardData.reduce((acc, r) => { acc[r.year] = (acc[r.year] || 0) + 1; return acc; }, {});
                const labels = Object.keys(yearCounts).sort();
                const data = labels.map(year => yearCounts[year]);

                if (state.charts.yearlyActivity) state.charts.yearlyActivity.destroy();
                state.charts.yearlyActivity = new Chart(getChartContext('yearly-activity-chart'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Articles per year', data, backgroundColor: '#a89974' }] },
                    options: { ...baseChartOptions, plugins: { legend: { display: false } } }
                });
            }

            // --- DATA TABLE FUNCTIONS ---
            function renderDataTable() {
                const { currentPage, rowsPerPage, sortColumn, sortDirection } = state.table;
                const sortedData = [...state.dashboardData].sort((a, b) => {
                    const valA = a[sortColumn];
                    const valB = b[sortColumn];
                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
                
                const paginatedData = sortedData.slice((currentPage - 1) * rowsPerPage, currentPage * rowsPerPage);
                
                const headers = [
                    { key: 'publication_date', label: 'Date' },
                    { key: 'title', label: 'Title' },
                    { key: 'original_publication', label: 'Publication' }
                ];

                const createSortArrow = (headerKey) => {
                    if (headerKey !== sortColumn) return '<span class="sort-arrow ml-1">↕</span>';
                    return sortDirection === 'asc' ? '<span class="sort-arrow active ml-1">↑</span>' : '<span class="sort-arrow active ml-1">↓</span>';
                }

                dataTableContainer.innerHTML = `
                    <table class="w-full text-sm text-left text-gray-700 data-table">
                        <thead class="text-xs text-gray-800 uppercase bg-gray-100">
                            <tr>${headers.map(h => `<th scope="col" class="px-6 py-3" data-sort="${h.key}">${h.label} ${createSortArrow(h.key)}</th>`).join('')}</tr>
                        </thead>
                        <tbody>${paginatedData.map(row => `
                            <tr class="bg-white border-b hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">${row.publication_date}</td>
                                <th scope="row" class="px-6 py-4 font-medium text-gray-900">${row.title}</th>
                                <td class="px-6 py-4">${row.original_publication}</td>
                            </tr>`).join('') || `<tr><td colspan="${headers.length}" class="text-center py-8">No data available for the selected filters.</td></tr>`}
                        </tbody>
                    </table>`;
                
                renderTablePagination(sortedData.length);
            }

            function renderTablePagination(totalRows) {
                const { currentPage, rowsPerPage } = state.table;
                const totalPages = Math.ceil(totalRows / rowsPerPage);
                const startRow = totalRows === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
                const endRow = Math.min(currentPage * rowsPerPage, totalRows);

                if (totalRows <= rowsPerPage && currentPage === 1) {
                    tablePaginationControls.innerHTML = `<span>Showing <span class="font-semibold">${totalRows}</span> results</span>`;
                    if (totalRows === 0) {
                       tablePaginationControls.innerHTML = '';
                    }
                    return;
                }

                tablePaginationControls.innerHTML = `
                    <span>Showing <span class="font-semibold">${startRow}</span> to <span class="font-semibold">${endRow}</span> of <span class="font-semibold">${totalRows}</span> results</span>
                    <div class="inline-flex">
                        <button id="table-prev-btn" class="px-4 py-2 text-sm font-medium text-white bg-gray-800 rounded-l hover:bg-gray-900 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">Prev</button>
                        <button id="table-next-btn" class="px-4 py-2 text-sm font-medium text-white bg-gray-800 border-0 border-l border-gray-700 rounded-r hover:bg-gray-900 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">Next</button>
                    </div>`;
            }
            
            dataTableContainer.addEventListener('click', (e) => {
                const header = e.target.closest('th[data-sort]');
                if (!header) return;
                const newSortColumn = header.dataset.sort;
                if (state.table.sortColumn === newSortColumn) {
                    state.table.sortDirection = state.table.sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    state.table.sortColumn = newSortColumn;
                    state.table.sortDirection = 'desc';
                }
                state.table.currentPage = 1;
                renderDataTable();
            });

            tablePaginationControls.addEventListener('click', (e) => {
                const totalPages = Math.ceil(state.dashboardData.length / state.table.rowsPerPage);
                if (e.target.id === 'table-prev-btn' && state.table.currentPage > 1) {
                    state.table.currentPage--;
                    renderDataTable();
                }
                if (e.target.id === 'table-next-btn' && state.table.currentPage < totalPages) {
                    state.table.currentPage++;
                    renderDataTable();
                }
            });

            // --- DATA EXPORT ---
            function exportDataToCSV() {
                if (state.dashboardData.length === 0) {
                    alert('No data to export for the current filter selection.');
                    return;
                }
                const headers = ['id', 'publication_date', 'title', 'original_publication', 'summary', 'key_concepts', 'thematic_categories'];
                const csvData = state.dashboardData.map(row => 
                    headers.map(header => {
                        const cell = row[header];
                        const value = Array.isArray(cell) ? cell.join('|') : cell;
                        return `"${String(value || '').replace(/"/g, '""')}"`;
                    }).join(',')
                );
                csvData.unshift(headers.join(','));
                
                const blob = new Blob([csvData.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', `rosen_archive_export_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- INITIALIZATION ---
            fetchData();
        });
    </script>
</body>
</html>
