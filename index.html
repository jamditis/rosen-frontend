
<!DOCTYPE html>
<!--
  jay rosen digital archive  —  an impossible press in view-source
  "the impossible press: american journalism and the decline of public life" (1986)

  a dissertation that sat in a drawer for 39 years, finally published december 2025.
  jay would say that the press-public relationship is transactional, not just informational.
  you opening view-source proves his point.

  stack: zero-build react 18 via esm.sh + htm, no bundler, no npm
  built by: joe amditis (archive curator)  —  jamditis@gmail.com
  more at: pressthink.org
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Rosen Digital Archive</title>
    <link rel="icon" href="./favicon.ico" />

    <!-- RSS Feed Autodiscovery (Dave Winer alignment) -->
    <link rel="alternate" type="application/rss+xml" title="Jay Rosen Digital Archive" href="./data/feeds/rss.xml" />
    <link rel="alternate" type="application/rss+xml" title="Jay Rosen Archive - Articles" href="./data/feeds/articles.xml" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Prefetch archive data for faster loading (core data loads first, details lazy-loaded) -->
    <link rel="prefetch" href="./data/archive-data.json" as="fetch">

    <!-- External CSS (versioned for cache busting) -->
    <link rel="stylesheet" href="./frontend/index.css?v=2.0.2" />

    <!-- Tailwind CSS (pre-built for production) -->
    <link rel="stylesheet" href="./frontend/dist/tailwind.css?v=2.0.2" />

  <!-- Import Map -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
    "sql.js": "https://esm.sh/sql.js@1.10.3"
  }
}
</script>
</head>
  <body class="antialiased font-body text-stone-900 min-h-screen flex flex-col">
    <div id="root"></div>
    
    <!-- Main Entry Point (versioned for cache busting) -->
    <script type="module" src="./frontend/index.js?v=2.0.2"></script>

    <!-- Easter egg for the curious -->
    <script>
      console.log('%c jay rosen digital archive ', 'background: #1c1917; color: #fdfbf7; font-weight: bold; font-size: 16px; padding: 4px 8px; border-radius: 2px; font-family: "Special Elite", serif;')
      console.log('%c "the impossible press: american journalism and the decline of public life" (1986)', 'color: #78716c; font-style: italic; font-size: 13px;')
      console.log('%c stack: zero-build react 18 · esm.sh · htm · no bundler · no npm', 'color: #a8a29e; font-size: 11px;')
      console.log('%c built by joe amditis  —  jamditis@gmail.com  —  pressthink.org', 'color: #a8a29e; font-size: 11px;')
    </script>

    <!-- Service Worker Registration (for offline support & fast caching) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./frontend/sw.js')
            .then(registration => {
              console.log('SW registered:', registration.scope);
            })
            .catch(err => {
              console.log('SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
