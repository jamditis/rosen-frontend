
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Rosen Internet Archive</title>
    <meta name="description" content="A curated public collection of the works, critiques, and teachings of Jay Rosen, professor of journalism at NYU. 29,000+ records spanning four decades." />
    <link rel="canonical" href="https://pressthink.org/j/rosen-archive/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Jay Rosen Internet Archive" />
    <meta property="og:description" content="A curated public collection of the works, critiques, and teachings of Jay Rosen, professor of journalism at NYU. 29,000+ records spanning four decades of journalism criticism, media theory, and public life." />
    <meta property="og:url" content="https://pressthink.org/j/rosen-archive/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jay Rosen Internet Archive" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Jay Rosen Internet Archive" />
    <meta name="twitter:description" content="A curated public collection of the works, critiques, and teachings of Jay Rosen, professor of journalism at NYU." />

    <link rel="icon" href="./favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Prefetch archive data for faster loading (core data loads first, details lazy-loaded) -->
    <link rel="prefetch" href="./data/archive-data.json" as="fetch">

    <!-- External CSS (versioned for cache busting) -->
    <link rel="stylesheet" href="./frontend/index.css?v=3.1.0" />

    <!-- Tailwind CSS (pre-built for production) -->
    <link rel="stylesheet" href="./frontend/dist/tailwind.css?v=3.1.0" />

  <!-- Import Map -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
    "sql.js": "https://esm.sh/sql.js@1.10.3"
  }
}
</script>
</head>
  <body class="antialiased font-body text-stone-900 min-h-screen flex flex-col">
    <div id="root"></div>
    
    <!-- Main Entry Point (versioned for cache busting) -->
    <script type="module" src="./frontend/index.js?v=3.1.0"></script>

    <!-- Service Worker Registration (for offline support & fast caching) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./frontend/sw.js')
            .then(registration => {
              console.log('SW registered:', registration.scope);
            })
            .catch(err => {
              console.log('SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
