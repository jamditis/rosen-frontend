
<!DOCTYPE html>
<!--
  jay rosen digital archive  —  an impossible press in view-source
  "the impossible press: american journalism and the decline of public life" (1986)

  a dissertation that sat in a drawer for 39 years, finally published december 2025.
  jay would say that the press-public relationship is transactional, not just informational.
  you opening view-source proves his point.

  stack: zero-build react 18 via esm.sh + htm, no bundler, no npm
