<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Press: Concept Sphere</title>
  <link rel="icon" href="../../../../favicon.ico" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto Mono', monospace;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #graph-container {
      width: 100%;
      height: 100%;
    }

    /* Header overlay */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 100;
      pointer-events: none;
    }

    .header h1 {
      font-family: 'Special Elite', 'Courier New', monospace;
      font-size: 1.5rem;
      color: #e8e8e8;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    /* Legacy .back-button styles - now using .nav-links container */

    .nav-links {
      position: absolute;
      top: 100px;
      right: 24px;
      z-index: 101;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      color: #e2e8f0;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .nav-link:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
    }

    .nav-link--accent:hover {
      border-color: #8c2f00;
      color: #f59e0b;
    }

    .header p {
      font-size: 0.75rem;
      color: #94a3b8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Info panel */
    .info-panel {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(10px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .info-panel.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .info-panel h2 {
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .info-panel .type {
      font-size: 0.7rem;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .info-panel .summary {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .info-panel .quote {
      font-style: italic;
      font-size: 0.85rem;
      color: #cbd5e1;
      padding-left: 16px;
      border-left: 2px solid #60a5fa;
      margin-bottom: 16px;
    }

    .info-panel .concepts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .info-panel .concept-tag {
      font-size: 0.7rem;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    /* Instructions overlay */
    .instructions {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: right;
      z-index: 100;
      pointer-events: none;
    }

    .instructions p {
      margin-bottom: 4px;
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      z-index: 100;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Loading state */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="loading">Loading concept sphere...</div>

    <div class="nav-links">
      <a href="../../foreword/" class="nav-link nav-link--accent">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        Author's Foreword
      </a>
      <a href="../../landing-page/" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Overview
      </a>
    </div>

    <div class="header">
      <h1>The Impossible Press</h1>
      <p>A 3D Exploration of Jay Rosen's 1986 Dissertation</p>
    </div>

    <div class="instructions">
      <p>Drag to rotate</p>
      <p>Scroll to zoom</p>
      <p>Click a node to explore</p>
    </div>

    <div id="graph-container"></div>

    <div class="info-panel hidden" id="info-panel">
      <h2 id="info-title">Select a concept</h2>
      <div class="type" id="info-type"></div>
      <div class="summary" id="info-summary"></div>
      <div class="quote" id="info-quote"></div>
      <div class="concepts" id="info-concepts"></div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #ef4444;"></div>
        <span>Root Thesis</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #f59e0b;"></div>
        <span>Parts</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #10b981;"></div>
        <span>Chapters</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #3b82f6;"></div>
        <span>Key Concepts</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #8b5cf6;"></div>
        <span>Thinkers</span>
      </div>
    </div>
  </div>

  <!-- Load Three.js first, then 3d-force-graph -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <script>
    // Dissertation data - derived from dissertationData.js
    const dissertationData = {
      nodes: [
        // Root
        { id: 'root', name: 'The Impossible Press', type: 'root',
          summary: 'A critical examination of the foundational assumption that "the press informs the public." Rosen argues this phrase obscures far more than it reveals.',
          quote: 'Journalism is not an activity conducted solely by journalists; it is a transaction that takes place between people.',
          concepts: ['Journalism as Transaction', 'Information as Relation', 'The Impossible Press'] },

        // Parts
        { id: 'part-1', name: 'The Making of the Modern Public', type: 'part',
          summary: 'Examines how modern conditions challenge traditional conceptions of press and public, tracing the historical emergence of the "public" as a political concept.',
          quote: 'News arises from distance—the need for journalism only emerges when events unfold beyond direct experience.',
          concepts: ['Modern Public', 'Penny Press', 'Urban Society'] },
        { id: 'part-2', name: 'The Public and the Professionalized Press', type: 'part',
          summary: 'Analyzes the professional attitude journalism developed and contrasts it with critiques by Lippmann and Dewey.',
          quote: 'The professional attitude obscured fundamental problems in the relationship between press and public.',
          concepts: ['Professionalization', 'Objectivity', 'Press Criticism'] },

        // Chapters
        { id: 'ch-1', name: 'Democracy and Distance', type: 'chapter',
          summary: 'News arrives from a distance. It crosses the space between individuals and events. Jefferson understood that an informed public was only possible in a small, self-contained community.',
          quote: 'News arrives from a distance. It crosses the space between individuals and events.',
          concepts: ['News as Distance', 'Jefferson\'s Dilemma', 'Scale of Democracy'] },
        { id: 'ch-2', name: 'Two Views of News', type: 'chapter',
          summary: 'There are two types of news—news as information (requiring action) and news as drama (requiring only spectation).',
          quote: 'Information is not really "in" the items which come over the wire... It is "in" the relations between people and a changing environment.',
          concepts: ['Information vs Drama', 'Human Interest', 'Sensationalism'] },
        { id: 'ch-3', name: 'The Universal Town Meeting', type: 'chapter',
          summary: 'The telegraph inspired utopian visions of democracy restored, but ignored problems with extending communication where no genuine community existed.',
          quote: 'Improvements in communication also make communication more difficult because they ensure there will be more to communicate about.',
          concepts: ['Technological Utopianism', 'Communication Paradox'] },
        { id: 'ch-4', name: 'From Crowd to Public', type: 'chapter',
          summary: 'The mass circulation newspaper created a new social body with ambiguous properties that alarmed social theorists.',
          quote: 'As a way of tying people together the newspaper has a dissolving as well as a connecting tendency.',
          concepts: ['Crowd Psychology', 'Public Formation', 'Mass Circulation'] },
        { id: 'ch-5', name: 'Communication Without Community', type: 'chapter',
          summary: 'The modern public is gathered together without actually meeting—a fundamental fact that changes the nature of public life.',
          quote: 'Our system of communication is not addressed at the public but at private individuals. We have evolved a radical form of mobilized privacy.',
          concepts: ['Mobilized Privacy', 'Attention Economy', 'Eclipse of Content'] },
        { id: 'ch-6', name: 'The Impossible Press', type: 'chapter',
          summary: 'Professionalization was an attempt to reconcile journalism as business with journalism as public service—but it assumed too much.',
          quote: 'An impossible press was born, one which sought to solve the whole problem of public life simply by controlling the conduct of journalists.',
          concepts: ['Professional Standards', 'Yellow Journalism', 'First Amendment'] },
        { id: 'ch-7', name: 'The Myth of the Omnicompetent Citizen', type: 'chapter',
          summary: 'Lippmann recognized that the classical democratic ideal of the informed citizen was incompatible with modern conditions.',
          quote: 'One could free all the facts in the world and still not be informing the public.',
          concepts: ['Pseudo-environment', 'Stereotypes', 'Manufacture of Consent'] },
        { id: 'ch-8', name: 'The Art and Science of Forming a Public', type: 'chapter',
          summary: 'Dewey argued for reconstruction of community as the basis for a revitalized public. There is no public out there waiting to be informed.',
          quote: 'Seeds are sown not by being thrown out at random, but by being so distributed as to take root and have a chance of growth.',
          concepts: ['Public Must Be Formed', 'Communication as Art', 'Great Community'] },
        { id: 'conclusion', name: 'Toward an Ecological View', type: 'chapter',
          summary: 'Proposes an "ecological" understanding that inserts five factors between press and public for adequate understanding.',
          quote: 'Presenting "all the news" is an impossible goal, and the press that avows it can only be an impossible press.',
          concepts: ['Ecological View', 'Five Factors', 'Scale Problem'] },

        // Key Thinkers
        { id: 'lippmann', name: 'Walter Lippmann', type: 'thinker',
          summary: 'Author of "Public Opinion" (1922) who first articulated the gap between democratic ideals and modern realities.',
          quote: 'For the most part we do not first see, and then define, we define first and then see.',
          concepts: ['Stereotypes', 'Pseudo-environment', 'Phantom Public'] },
        { id: 'dewey', name: 'John Dewey', type: 'thinker',
          summary: 'Philosopher who argued that the public is not a given but an achievement through shared understanding.',
          quote: 'Till the Great Society is converted into a Great Community, the Public will remain in eclipse.',
          concepts: ['Great Community', 'Democratic Experience', 'Communication as Art'] },
        { id: 'park', name: 'Robert Park', type: 'thinker',
          summary: 'Chicago School sociologist who studied the newspaper as a social institution shaping urban life.',
          quote: 'The newspaper is the great medium of communication within the city.',
          concepts: ['Urban Sociology', 'Human Interest', 'City Life'] },
        { id: 'tarde', name: 'Gabriel Tarde', type: 'thinker',
          summary: 'French sociologist who distinguished between crowds (physical) and publics (dispersed).',
          quote: 'The public is the social group of the future.',
          concepts: ['Crowd vs Public', 'Imitation', 'Social Psychology'] },
        { id: 'jefferson', name: 'Thomas Jefferson', type: 'thinker',
          summary: 'Understood that an informed public required limits on scale—hence his advocacy for ward republics.',
          quote: 'Where the press is free, and every man able to read, all is safe.',
          concepts: ['Ward Republics', 'Self-Governance', 'Scale Problem'] },

        // Key Concepts (extracted from chapters)
        { id: 'c-transaction', name: 'Journalism as Transaction', type: 'concept',
          summary: 'Journalism is not an activity conducted solely by journalists but a transaction between producers and consumers.',
          concepts: [] },
        { id: 'c-distance', name: 'News as Function of Distance', type: 'concept',
          summary: 'The need for journalism only emerges when events unfold beyond the reach of direct experience.',
          concepts: [] },
        { id: 'c-information', name: 'Information as Relation', type: 'concept',
          summary: 'Information is not "in" the news but in the relationship between people and their environment.',
          concepts: [] },
        { id: 'c-stereotype', name: 'The Stereotype', type: 'concept',
          summary: 'A form of perception that works from private belief toward reality: we define first and then see.',
          concepts: [] },
        { id: 'c-public', name: 'Public as Achievement', type: 'concept',
          summary: 'A public doesn\'t exist automatically; it must be created through shared understanding of common problems.',
          concepts: [] },
        { id: 'c-objectivity', name: 'Objectivity as Defense', type: 'concept',
          summary: 'Objectivity became a defense mechanism for journalists, not a path to truth.',
          concepts: [] },
        { id: 'c-privacy', name: 'Mobilized Privacy', type: 'concept',
          summary: 'The individual hooked into long lines of communication from remote sources—public transmission, private reception.',
          concepts: [] },
        { id: 'c-impossible', name: 'The Impossible Press', type: 'concept',
          summary: 'A press that sought to solve public life\'s problems solely by controlling journalist conduct.',
          concepts: [] },
      ],
      links: [
        // Root to Parts
        { source: 'root', target: 'part-1' },
        { source: 'root', target: 'part-2' },

        // Part 1 to Chapters
        { source: 'part-1', target: 'ch-1' },
        { source: 'part-1', target: 'ch-2' },
        { source: 'part-1', target: 'ch-3' },
        { source: 'part-1', target: 'ch-4' },
        { source: 'part-1', target: 'ch-5' },

        // Part 2 to Chapters
        { source: 'part-2', target: 'ch-6' },
        { source: 'part-2', target: 'ch-7' },
        { source: 'part-2', target: 'ch-8' },
        { source: 'part-2', target: 'conclusion' },

        // Thinkers to Chapters
        { source: 'jefferson', target: 'ch-1' },
        { source: 'park', target: 'ch-2' },
        { source: 'tarde', target: 'ch-4' },
        { source: 'park', target: 'ch-5' },
        { source: 'lippmann', target: 'ch-6' },
        { source: 'lippmann', target: 'ch-7' },
        { source: 'dewey', target: 'ch-8' },

        // Concepts to Root/Chapters
        { source: 'root', target: 'c-transaction' },
        { source: 'root', target: 'c-impossible' },
        { source: 'ch-1', target: 'c-distance' },
        { source: 'ch-2', target: 'c-information' },
        { source: 'ch-7', target: 'c-stereotype' },
        { source: 'ch-8', target: 'c-public' },
        { source: 'ch-6', target: 'c-objectivity' },
        { source: 'ch-5', target: 'c-privacy' },

        // Thinker to concept connections
        { source: 'lippmann', target: 'c-stereotype' },
        { source: 'dewey', target: 'c-public' },
        { source: 'jefferson', target: 'c-distance' },
      ]
    };

    // Color scheme
    const colorMap = {
      root: '#ef4444',      // Red
      part: '#f59e0b',      // Amber
      chapter: '#10b981',   // Emerald
      concept: '#3b82f6',   // Blue
      thinker: '#8b5cf6',   // Violet
    };

    // Size scheme
    const sizeMap = {
      root: 20,
      part: 12,
      chapter: 8,
      concept: 6,
      thinker: 10,
    };

    // Initialize the graph
    const container = document.getElementById('graph-container');
    const infoPanel = document.getElementById('info-panel');

    // Hide loading
    document.querySelector('.loading').style.display = 'none';

    const Graph = ForceGraph3D()
      (container)
      .graphData(dissertationData)
      .nodeLabel(node => node.name)
      .nodeColor(node => colorMap[node.type] || '#64748b')
      .nodeVal(node => sizeMap[node.type] || 6)
      .nodeOpacity(0.9)
      .linkColor(link => {
        // Color links based on source node type
        const sourceNode = dissertationData.nodes.find(n => n.id === link.source || n.id === link.source.id);
        if (sourceNode) {
          const color = colorMap[sourceNode.type] || '#64748b';
          // Return with reduced opacity
          return color + '80'; // 50% opacity hex
        }
        return 'rgba(148, 163, 184, 0.5)';
      })
      .linkWidth(2)
      .linkOpacity(0.7)
      .backgroundColor('rgba(0,0,0,0)')
      .showNavInfo(false)
      .onNodeClick(node => {
        // Update info panel
        document.getElementById('info-title').textContent = node.name;
        document.getElementById('info-type').textContent = node.type.toUpperCase();
        document.getElementById('info-summary').textContent = node.summary || '';

        const quoteEl = document.getElementById('info-quote');
        if (node.quote) {
          quoteEl.textContent = `"${node.quote}"`;
          quoteEl.style.display = 'block';
        } else {
          quoteEl.style.display = 'none';
        }

        const conceptsEl = document.getElementById('info-concepts');
        conceptsEl.innerHTML = '';
        if (node.concepts && node.concepts.length > 0) {
          node.concepts.forEach(c => {
            const tag = document.createElement('span');
            tag.className = 'concept-tag';
            tag.textContent = c;
            conceptsEl.appendChild(tag);
          });
        }

        infoPanel.classList.remove('hidden');

        // Zoom to node
        const distance = 150;
        const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          1500
        );
      })
      .onBackgroundClick(() => {
        infoPanel.classList.add('hidden');
      });

    // Helper function to wrap text
    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = '';

      for (const word of words) {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) {
        lines.push(currentLine);
      }
      return lines.slice(0, 3); // Max 3 lines
    }

    // Custom node rendering with colored spheres, bounding boxes, and word-wrapped labels
    Graph.nodeThreeObject(node => {
      const nodeColor = colorMap[node.type] || '#64748b';
      const nodeSize = sizeMap[node.type] || 6;

      // Create a group to hold sphere + label
      const group = new THREE.Group();

      // Create colored sphere
      const sphereGeometry = new THREE.SphereGeometry(nodeSize, 16, 16);
      const sphereMaterial = new THREE.MeshLambertMaterial({
        color: nodeColor,
        transparent: true,
        opacity: 0.9
      });
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      group.add(sphere);

      // Add a glowing ring/outline for emphasis
      const ringGeometry = new THREE.RingGeometry(nodeSize * 1.2, nodeSize * 1.4, 32);
      const ringMaterial = new THREE.MeshBasicMaterial({
        color: nodeColor,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.lookAt(0, 0, 1); // Face camera roughly
      group.add(ring);

      // Create canvas for text label with bounding box
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      // Configure text
      const fontSize = node.type === 'root' ? 28 : (node.type === 'part' ? 24 : 20);
      ctx.font = `bold ${fontSize}px Roboto Mono, monospace`;

      // Word wrap the text
      const maxTextWidth = canvas.width - 40;
      const lines = wrapText(ctx, node.name, maxTextWidth);
      const lineHeight = fontSize * 1.3;
      const textHeight = lines.length * lineHeight;
      const padding = 12;
      const boxHeight = textHeight + padding * 2;
      const boxY = (canvas.height - boxHeight) / 2;

      // Measure widest line for box width
      let maxLineWidth = 0;
      for (const line of lines) {
        const w = ctx.measureText(line).width;
        if (w > maxLineWidth) maxLineWidth = w;
      }
      const boxWidth = maxLineWidth + padding * 2;
      const boxX = (canvas.width - boxWidth) / 2;

      // Draw rounded rectangle background
      const radius = 8;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.beginPath();
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + boxWidth - radius, boxY);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + radius);
      ctx.lineTo(boxX + boxWidth, boxY + boxHeight - radius);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY + boxHeight, boxX + boxWidth - radius, boxY + boxHeight);
      ctx.lineTo(boxX + radius, boxY + boxHeight);
      ctx.quadraticCurveTo(boxX, boxY + boxHeight, boxX, boxY + boxHeight - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();
      ctx.fill();

      // Draw colored left border
      ctx.fillStyle = nodeColor;
      ctx.beginPath();
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + 4, boxY);
      ctx.lineTo(boxX + 4, boxY + boxHeight);
      ctx.lineTo(boxX + radius, boxY + boxHeight);
      ctx.quadraticCurveTo(boxX, boxY + boxHeight, boxX, boxY + boxHeight - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();
      ctx.fill();

      // Draw text lines
      ctx.fillStyle = '#f1f5f9';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const textStartY = boxY + padding + lineHeight / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width / 2, textStartY + i * lineHeight);
      });

      // Create sprite from canvas
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      const spriteMaterial = new THREE.SpriteMaterial({
        map: texture,
        transparent: true
      });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(60, 15, 1);
      sprite.position.y = nodeSize + 12;
      group.add(sprite);

      return group;
    });

    // Add lighting to the scene for proper sphere coloring
    const scene = Graph.scene();

    // Ambient light for base visibility
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    // Directional light for depth/shading
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(100, 100, 100);
    scene.add(directionalLight);

    // Second directional light from opposite side
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight2.position.set(-100, -50, -100);
    scene.add(directionalLight2);

    // Initial camera position
    Graph.cameraPosition({ x: 0, y: 0, z: 400 });

    // Add gentle rotation
    let angle = 0;
    function animate() {
      angle += 0.001;
      Graph.scene().rotation.y = angle;
      requestAnimationFrame(animate);
    }
    // Uncomment for auto-rotation:
    // animate();
  </script>
</body>
</html>
