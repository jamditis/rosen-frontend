name: Post-merge dashboard sync

on:
  push:
    branches: [main, master]

jobs:
  notify-dashboard:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Get associated PR
        id: pr
        run: |
          RESULT=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq 'if length > 0 then .[0] | {number: .number, title: .title} else {} end' \
            2>/dev/null || echo '{}')
          echo "number=$(echo $RESULT | jq -r '.number // empty')" >> $GITHUB_OUTPUT
          echo "title=$(echo $RESULT | jq -r '.title // empty')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify dashboard
        if: steps.pr.outputs.number != ''
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # Use jq to build JSON safely — PR titles can contain quotes and special chars
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg by "$ACTOR" \
            --arg sha "$SHA" \
            '{repo: $repo, pr_number: $pr, title: $title, merged_by: $by, sha: $sha}')
          curl -sf \
            -X POST "https://pi.amditis.tech/api/webhooks/github-merge" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Dashboard notify failed (non-fatal)"
