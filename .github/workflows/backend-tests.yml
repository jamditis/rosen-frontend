name: Backend Tests

on:
  # Manual trigger so a runner pass can be observed before this gates real PRs
  # again (it was disabled_manually after the Dec 2025 failures — #444).
  workflow_dispatch:
    inputs:
      pressthink_source_check:
        description: 'Also run the bounded read-only PressThink source dry run'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, 'recovery/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The pinned Python Playwright release supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize source publication assets
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        run: git lfs pull --include="frontend/vendor/semantic/v1/**"

      - name: Set up Node for the source-to-thread integration test
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          cache: npm

      - name: Install thread validation dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      
      - name: Install dependencies
        working-directory: backend
        run: |
          poetry install --with dev
      
      - name: Install Playwright browsers
        working-directory: backend
        run: |
          poetry run playwright install --with-deps chromium
      
      - name: Run tests
        working-directory: backend
        run: |
          poetry run pytest -v --tb=short
        env:
          CI: true

      - name: Check source publication integration on hosted runner
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        run: npm test

      - name: Read-only PressThink source check
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        working-directory: backend
        run: poetry run python scripts/pressthink_batch_update.py --dry-run --report "$RUNNER_TEMP/pressthink-dry-run.json"

      - name: Retain the source rehearsal report
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        uses: actions/upload-artifact@v6
        with:
          name: pressthink-source-rehearsal
          path: ${{ runner.temp }}/pressthink-dry-run.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only publisher feed checks
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        working-directory: backend
        run: |
          mkdir -p "$RUNNER_TEMP/publisher-feeds"
          for source in cjr-jay-rosen-search cjr-jay-rosen-author common-dreams-jay-rosen-author; do
            poetry run python scripts/publisher_feed_batch_update.py --source "$source" --dry-run --report "$RUNNER_TEMP/publisher-feeds/$source.json"
          done

      - name: Retain publisher feed rehearsals
        if: github.event_name == 'workflow_dispatch' && inputs.pressthink_source_check
        uses: actions/upload-artifact@v6
        with:
          name: publisher-feed-rehearsals
          path: ${{ runner.temp }}/publisher-feeds/*.json
          if-no-files-found: error
          retention-days: 14
