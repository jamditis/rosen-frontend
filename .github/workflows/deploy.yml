name: Pillar 3c — deploy full site to pressthink.org

# Manually-triggered (workflow_dispatch only) full-site SFTP push.
# Replaces the manual FileZilla-style deploy with one click in the Actions UI.
#
# Pairs with backend/scripts/deploy_full_site.py — runs that script against
# the secrets below. Reuses the same ROSEN_SFTP_* credentials as the per-record
# `submit-record.yml`, plus one new secret:
#   ROSEN_SFTP_SITE_PATH → the site root (e.g. /home/u/public_html/j/rosen-archive)
# Distinct from ROSEN_SFTP_REMOTE_PATH (the per-record data subdir) so a
# misconfigured per-record workflow can't accidentally write outside data/.
#
# Security: workflow_dispatch inputs are restricted to collaborators with
# write+ access. The only input (dry_run) is a typed boolean — no string
# interpolation into shell commands. Secrets and inputs both flow through
# the env: block, never directly into run: expressions.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the SFTP upload, just report what would be pushed'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Match the five-hour queue bound and reserve the final hour for deployment.
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          # The reader's original dissertation PDF is a Git LFS object. A
          # pointer-only checkout would upload 133 bytes instead of the PDF.
          lfs: true

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # GitHub concurrency groups retain only one pending run. This FIFO wait
      # leaves every dispatch intact while preventing full and per-record deploys
      # from publishing overlapping versions of the data and metadata shells.
      - name: Wait for release turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_QUEUE_TIMEOUT_SECONDS: 18000
        run: node .github/scripts/wait-release-turn.mjs

      - name: Refresh main after queue wait
        run: |
          git fetch origin main
          git checkout --detach FETCH_HEAD

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies (runtime only)
        working-directory: backend
        run: poetry install --without dev --no-interaction

      - name: Materialize SFTP private key (optional, key-auth)
        # Same key-auth plumbing as submit-record.yml (#302). deploy_full_site.py
        # shares sftp_push.py's auth precedence (key over password when a key path
        # is present), so when the ROSEN_SFTP_KEY_CONTENT secret is set, write it
        # to a runner-temp file (0600) and export ROSEN_SFTP_KEY_PATH. No-op while
        # the secret is unset, so the full-site deploy keeps using password auth
        # until the cutover.
        env:
          ROSEN_SFTP_KEY_CONTENT: ${{ secrets.ROSEN_SFTP_KEY_CONTENT }}
        run: |
          if [ -n "$ROSEN_SFTP_KEY_CONTENT" ]; then
            umask 077
            printf '%s\n' "$ROSEN_SFTP_KEY_CONTENT" > "$RUNNER_TEMP/rosen_deploy"
            chmod 600 "$RUNNER_TEMP/rosen_deploy"
            echo "ROSEN_SFTP_KEY_PATH=$RUNNER_TEMP/rosen_deploy" >> "$GITHUB_ENV"
            echo "SFTP auth: private key materialized; using key-based authentication."
          else
            echo "SFTP auth: ROSEN_SFTP_KEY_CONTENT unset; using password authentication."
          fi

      - name: Deploy
        working-directory: backend
        env:
          # Auth + remote path. ROSEN_SFTP_SITE_PATH is the new secret —
          # distinct from ROSEN_SFTP_REMOTE_PATH (data subdir) by design.
          ROSEN_SFTP_HOST: ${{ secrets.ROSEN_SFTP_HOST }}
          ROSEN_SFTP_USER: ${{ secrets.ROSEN_SFTP_USER }}
          ROSEN_SFTP_PASSWORD: ${{ secrets.ROSEN_SFTP_PASSWORD }}
          ROSEN_SFTP_SITE_PATH: ${{ secrets.ROSEN_SFTP_SITE_PATH }}
          ROSEN_SFTP_PORT: ${{ secrets.ROSEN_SFTP_PORT }}
          # ROSEN_SFTP_KEY_PATH is exported by the "Materialize SFTP private key"
          # step above (via $GITHUB_ENV) when key-auth is enabled. Do not also set
          # it from a secret here: a step-level env entry overrides $GITHUB_ENV, so
          # the usually-empty secret would shadow the materialized runner-temp path
          # and silently fall back to password auth.
          ROSEN_SFTP_KEY_PASSPHRASE: ${{ secrets.ROSEN_SFTP_KEY_PASSPHRASE }}
          ROSEN_SFTP_KNOWN_HOSTS: ${{ secrets.ROSEN_SFTP_KNOWN_HOSTS }}
          # The dry_run input is a typed boolean — safe to flow through env.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            poetry run python scripts/deploy_full_site.py --dry-run
          else
            poetry run python scripts/deploy_full_site.py
          fi
