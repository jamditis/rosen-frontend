name: Pillar 3c — deploy full site to pressthink.org

# Weekly and manually triggered full-site transfer of reviewed main.
# Replaces the manual FileZilla-style deploy with one tested release path.
#
# Pairs with backend/scripts/deploy_full_site.py — runs that script against
# the secrets below. Reuses the same transfer credentials as the per-record
# `submit-record.yml`, plus these deployment settings:
#   ROSEN_TRANSFER_PROTOCOL → ftps for Edgar's port-21 service
#   ROSEN_SFTP_SITE_PATH → the archive root (FTPS: j/rosen-archive)
# Distinct from ROSEN_SFTP_REMOTE_PATH (the per-record data subdir) so a
# misconfigured per-record workflow can't accidentally write outside data/.
#
# Security: workflow_dispatch inputs are restricted to collaborators with
# write+ access. The only input (dry_run) is a typed boolean — no string
# interpolation into shell commands. Secrets and inputs both flow through
# the env: block, never directly into run: expressions.

on:
  schedule:
    - cron: '17 9 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the upload, just report what would be pushed'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    # Match the five-hour queue bound and reserve the final hour for deployment.
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          # The reader's original dissertation PDF is a Git LFS object. A
          # pointer-only checkout would upload 133 bytes instead of the PDF.
          lfs: true

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # GitHub concurrency groups retain only one pending run. This FIFO wait
      # leaves every dispatch intact while preventing full and per-record deploys
      # from publishing overlapping versions of the data and metadata shells.
      - name: Wait for release turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_QUEUE_TIMEOUT_SECONDS: 18000
        run: node .github/scripts/wait-release-turn.mjs

      - name: Refresh main after queue wait
        run: |
          git fetch origin main
          git checkout --detach FETCH_HEAD

      - name: Install Node dependencies
        run: npm ci

      - name: Run repository tests
        id: tests
        run: npm test

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies (runtime only)
        working-directory: backend
        run: poetry install --without dev --no-interaction

      - name: Materialize SFTP private key (optional, key-auth)
        # Only the backward-compatible SFTP adapter supports key auth. Edgar's
        # FTPS service always uses password auth, so an SFTP key is materialized
        # only when the selected protocol is sftp.
        env:
          ROSEN_TRANSFER_PROTOCOL: ${{ secrets.ROSEN_TRANSFER_PROTOCOL }}
          ROSEN_SFTP_KEY_CONTENT: ${{ secrets.ROSEN_SFTP_KEY_CONTENT }}
        run: |
          protocol="${ROSEN_TRANSFER_PROTOCOL:-sftp}"
          protocol="${protocol,,}"
          protocol="${protocol//[[:space:]]/}"
          if [ "$protocol" = "sftp" ] && [ -n "$ROSEN_SFTP_KEY_CONTENT" ]; then
            umask 077
            printf '%s\n' "$ROSEN_SFTP_KEY_CONTENT" > "$RUNNER_TEMP/rosen_deploy"
            chmod 600 "$RUNNER_TEMP/rosen_deploy"
            echo "ROSEN_SFTP_KEY_PATH=$RUNNER_TEMP/rosen_deploy" >> "$GITHUB_ENV"
            echo "Transfer auth: private key materialized for SFTP."
          else
            echo "Transfer auth: private key not materialized; using password authentication."
          fi

      - name: Deploy
        id: deploy
        working-directory: backend
        env:
          # Auth + remote path. ROSEN_SFTP_SITE_PATH is distinct from
          # ROSEN_SFTP_REMOTE_PATH (data subdir) by design.
          ROSEN_TRANSFER_PROTOCOL: ${{ secrets.ROSEN_TRANSFER_PROTOCOL }}
          ROSEN_SFTP_HOST: ${{ secrets.ROSEN_SFTP_HOST }}
          ROSEN_SFTP_USER: ${{ secrets.ROSEN_SFTP_USER }}
          ROSEN_SFTP_PASSWORD: ${{ secrets.ROSEN_SFTP_PASSWORD }}
          ROSEN_SFTP_SITE_PATH: ${{ secrets.ROSEN_SFTP_SITE_PATH }}
          ROSEN_SFTP_PORT: ${{ secrets.ROSEN_SFTP_PORT }}
          # ROSEN_SFTP_KEY_PATH is exported by the "Materialize SFTP private key"
          # step above (via $GITHUB_ENV) when key-auth is enabled. Do not also set
          # it from a secret here: a step-level env entry overrides $GITHUB_ENV, so
          # the usually-empty secret would shadow the materialized runner-temp path
          # and silently fall back to password auth.
          ROSEN_SFTP_KEY_PASSPHRASE: ${{ secrets.ROSEN_SFTP_KEY_PASSPHRASE }}
          ROSEN_SFTP_KNOWN_HOSTS: ${{ secrets.ROSEN_SFTP_KNOWN_HOSTS }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            poetry run python scripts/deploy_full_site.py --dry-run
          else
            poetry run python scripts/deploy_full_site.py
          fi

      - name: Verify live deploy
        id: verify_live
        if: steps.deploy.outcome == 'success' && env.DRY_RUN != 'true'
        run: node .github/scripts/verify-live-deploy.mjs

      - name: Write deployment summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_live.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          tested_commit="$(git rev-parse HEAD)"
          {
            echo "## Rosen Archive deployment"
            echo
            echo "- Trigger: \`$TRIGGER_NAME\`"
            echo "- Tested main commit: \`$tested_commit\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Tests: \`$TEST_OUTCOME\`"
            echo "- Deploy: \`$DEPLOY_OUTCOME\`"
            echo "- Live byte verification: \`$VERIFY_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"
