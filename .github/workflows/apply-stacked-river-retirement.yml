name: Apply stacked River of News retirement

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - cleanup/retire-data-explorer-deploy

permissions:
  contents: write

concurrency:
  group: apply-stacked-river-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'cleanup/archive-river-of-news' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out child branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Extract and run the assertion-guarded edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-river-retirement.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start + 1:end]:
              if line == '':
                  body.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded-script indentation: {line!r}')
              body.append(line[10:])
          Path('/tmp/apply-river-retirement.py').write_text(
              '\n'.join(body) + '\n',
              encoding='utf-8',
          )
          PY
          python3 /tmp/apply-river-retirement.py

      - name: Stamp release markers
        run: node scripts/bump-version.mjs 3.8.25

      - name: Validate targeted contracts
        shell: bash
        run: |
          git diff --check
          node --test tests/river-of-news-retirement.test.js tests/discovery-design-refresh.test.js tests/version-consistency.test.js
          python3 -m pip install --disable-pip-version-check pytest paramiko
          python3 -m pytest backend/tests/test_river_of_news_retirement.py backend/tests/test_deploy_full_site.py

      - name: Commit completed child change
        shell: bash
        run: |
          rm .github/workflows/apply-river-retirement.yml
          git config user.name 'Joe Amditis'
          git config user.email '6799804+jamditis@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'cleanup: archive unreachable River of News'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
