name: Backend Linting

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-linting.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-linting.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # mypy is kept in sync with the dev-dependency pin in backend/pyproject.toml.
          pip install ruff==0.15.12 black==24.4.2 mypy==1.13.0

      # Ruff gates the build: a finding fails the job. The scope covers every
      # backend Python tree, and per-file E402 ignores live in pyproject.toml.
      - name: Run Ruff
        working-directory: backend
        run: |
          ruff check src/ tests/ submission_server/ scripts/

      # Black is not yet enforced — the backend predates any black pass, so this
      # step reports diffs without failing. Drop continue-on-error once the
      # codebase has been reformatted.
      - name: Check Black formatting
        working-directory: backend
        run: |
          black --check src/ tests/
        continue-on-error: true

      # MyPy is not yet enforced — the codebase is not fully type-annotated
      # (see mypy.ini: disallow_untyped_defs = False). Drop continue-on-error
      # once annotations are complete.
      - name: Run MyPy type checking
        working-directory: backend
        run: |
          mypy src/
        continue-on-error: true
