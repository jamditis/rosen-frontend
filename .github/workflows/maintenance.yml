name: Batch maintenance runner

# Manual-dispatch home for the archive's out-of-band maintenance jobs. Design:
# docs/plans/2026-05-29-batch-maintenance-runner-design.md
#
# v1 jobs:
#   key_concepts    Gemini key-concept tagging on the master sheet
#   dedup           deterministic multi-value normalization on the master sheet
#   sync_to_archive merge enriched sheet columns into the repo CSV, regenerate
#                   JSON, run npm test, then open a PR (no direct push to main)
#
# Safety rails (docs/narrative/data-pipeline.md):
#   * dry_run defaults TRUE  -- the first run of any job is a no-write rehearsal.
#   * limit defaults to 25   -- never the whole archive in one run (6h job cap).
#   * the key_concepts job exits non-zero if it makes Gemini calls but writes
#     zero cells (the "$0.53 wasted, AI ran but nothing saved" failure).
#   * sync_to_archive opens a PR for human review; the live push is the separate
#     deploy.yml (Pillar 3c) run after the PR merges.
#
# workflow_dispatch is restricted to collaborators with write+ access. The job,
# limit, and dry_run inputs flow through the env block, never interpolated into
# a run: command, so a hostile value can't break out of the shell (same rule as
# submit-record.yml).

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Which maintenance job to run'
        required: true
        type: choice
        options:
          - key_concepts
          - dedup
          - sync_to_archive
      limit:
        description: 'Max rows/records to touch this run (escalate 5 -> 25 -> 100)'
        required: false
        type: string
        default: '25'
      dry_run:
        description: 'Rehearse only -- log what would change, write nothing'
        required: false
        type: boolean
        default: true

concurrency:
  group: batch-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required configuration
        env:
          JOB: ${{ inputs.job }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          ROSEN_SHEETS_SA_KEY_JSON: ${{ secrets.ROSEN_SHEETS_SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROSEN_GH_APP_ID: ${{ secrets.ROSEN_GH_APP_ID }}
          ROSEN_GH_APP_PRIVATE_KEY: ${{ secrets.ROSEN_GH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          require_config() {
            if [ -z "${!1:-}" ]; then
              missing+=("$1")
            fi
          }

          require_config SPREADSHEET_NAME
          require_config ROSEN_SHEETS_SA_KEY_JSON
          case "$JOB" in
            key_concepts)
              require_config GEMINI_API_KEY
              ;;
            dedup)
              ;;
            sync_to_archive)
              require_config ROSEN_GH_APP_ID
              require_config ROSEN_GH_APP_PRIVATE_KEY
              ;;
            *)
              echo "Unknown job: $JOB" >&2
              exit 1
              ;;
          esac

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Required configuration is present for job=$JOB"

      - name: Mint GitHub App installation token
        if: ${{ inputs.job == 'sync_to_archive' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ROSEN_GH_APP_ID }}
          private-key: ${{ secrets.ROSEN_GH_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev

      # Node + npm deps are only needed by sync_to_archive (JSON regen + tests),
      # but installing them unconditionally keeps a single job path.
      - name: Install root npm dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "rosen-archive-bot[bot]"
          git config user.email "rosen-archive-bot[bot]@users.noreply.github.com"

      - name: Run maintenance job
        working-directory: backend
        env:
          # Dispatch inputs -- read as env vars, never inlined into the command.
          JOB: ${{ inputs.job }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Sheet auth + name. SPREADSHEET_NAME must be set as a repo secret so
          # the jobs open the right sheet by name (see maintenance-runbook.md).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROSEN_SHEETS_SA_KEY_JSON: ${{ secrets.ROSEN_SHEETS_SA_KEY_JSON }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          # Optional override; scripts default to the current archive_records
          # tab when this repository variable is unset.
          ROSEN_MASTER_SHEET_TAB: ${{ vars.ROSEN_MASTER_SHEET_TAB }}
          # sync_to_archive only: gh opens the review PR with the App token so
          # the new PR triggers CI (a PR opened by the default GITHUB_TOKEN would
          # not). The App needs Contents: write + Pull requests: write.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GIT_BOT_NAME: rosen-archive-bot
          GIT_BOT_EMAIL: "rosen-archive-bot[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi
          echo "Running job=$JOB limit=$LIMIT dry_run=$DRY_RUN"
          case "$JOB" in
            key_concepts)
              poetry run python -m rosen_scraper.key_concepts_updater --limit "$LIMIT" $DRY_FLAG
              ;;
            dedup)
              poetry run python scripts/diagnostics/data_deduper.py --limit "$LIMIT" $DRY_FLAG
              ;;
            sync_to_archive)
              poetry run python scripts/sync_sheet_to_archive.py --limit "$LIMIT" $DRY_FLAG
              ;;
            *)
              echo "Unknown job: $JOB" >&2
              exit 1
              ;;
          esac
