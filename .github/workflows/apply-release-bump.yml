name: Apply required release marker bump

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-release-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.pull_request.head.ref == 'cleanup/retire-data-explorer-deploy' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply the canonical version bump
        run: node scripts/bump-version.mjs 3.8.24

      - name: Commit the completed bump and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/apply-release-bump.yml
          git config user.name 'Joe Amditis'
          git config user.email '6799804+jamditis@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: bump release markers to 3.8.24'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
