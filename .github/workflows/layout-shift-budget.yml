name: Layout shift budget

# The preview audit is the layout-shift gate (#772). Frontend Validation skips
# the Playwright browser download on purpose, so the audit runs here instead:
# one job per viewport, then one job that publishes the candidate against the
# recorded baseline.
#
# Third-party modules and fonts come from the local mirror, so a slow or
# unavailable CDN cannot move the numbers or fail the run.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'index.html'
      - 'features/**'
      - 'faq/**'
      - 'dissertation/**'
      - 'tools/**'
      - 'scripts/preview-audit.js'
      - 'scripts/preview-server.js'
      - 'scripts/layout-shift-budgets.js'
      - 'scripts/layout-shift-probe.js'
      - 'scripts/layout-shift-delta.js'
      - 'scripts/mirror-audit-modules.js'
      - '.github/workflows/layout-shift-budget.yml'
  workflow_dispatch:

concurrency:
  group: layout-shift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mirror third-party modules and fonts
        run: node scripts/mirror-audit-modules.js

      - name: Run preview audit
        run: npm run preview:audit
        env:
          PREVIEW_AUDIT_MODULE_CACHE: '1'
          PREVIEW_AUDIT_VIEWPORT: ${{ matrix.viewport }}

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-audit-${{ matrix.viewport }}
          path: preview-audit-results/
          retention-days: 14

  delta:
    name: Publish baseline delta
    runs-on: ubuntu-latest
    needs: audit
    if: always()
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          pattern: preview-audit-*
          path: audit-artifacts

      - name: Publish candidate against baseline
        run: |
          node scripts/layout-shift-delta.js \
            $(find audit-artifacts -name layout-shift-baseline.json | sort)
