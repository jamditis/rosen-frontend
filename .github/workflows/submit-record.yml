name: Pillar 3a — submit record

# Fired by Apps Script (the queue-sheet "Process new submissions" button) via
# the GitHub API workflow_dispatch endpoint. Runs backend/scripts/process_submission.py
# end-to-end for one row: scrape, categorize, append CSV, regen JSONs, npm test,
# git push to main, verified transfer to pressthink.org, sheet writeback.
#
# Design: docs/plans/2026-05-24-pillar3a-free-auto-deploy-design.md
#
# All workflow_dispatch inputs are sheet-controlled and not directly user-typed,
# but they ARE attacker-influenceable (a malicious URL or title would still flow
# in). They MUST be passed via the env: block, never inlined into a run: command
# via ${{ inputs.X }} — that pattern is shell-command-injection-prone because
# the expression is substituted before the shell parses quoting.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Submission URL to scrape and archive'
        required: true
        type: string
      title:
        description: 'Optional human-provided title (falls back to scraped title)'
        required: false
        type: string
        default: ''
      notes:
        description: 'Optional human-provided notes (free text, stored on record)'
        required: false
        type: string
        default: ''
      raw_text:
        description: 'Optional pasted article text — used when the URL cannot be scraped (Medium, paywalled, bot-walled). When set, the network scrape is skipped and this text is processed directly. GitHub caps total workflow_dispatch inputs at 65,535 chars, so a body near that limit will fail to dispatch; Phase 3 (#353) moves large bodies to the queue sheet.'
        required: false
        type: string
        default: ''
      sheet_id:
        description: 'Google Sheets spreadsheet id holding the queue row'
        required: true
        type: string
      sheet_tab:
        description: 'Queue tab name (defaults to "Sheet1")'
        required: false
        type: string
        default: 'Sheet1'
      sheet_row:
        description: 'Queue row number (1-indexed) for writeback'
        required: true
        type: string
      retry_record_id:
        description: 'Archived record id whose metadata shell needs retry'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    # Five hours may be spent behind older releases, leaving one hour for the
    # submission pipeline after the FIFO wait completes.
    timeout-minutes: 360
    steps:
      - name: Checkout release queue helper
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wait for release turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_QUEUE_TIMEOUT_SECONDS: 18000
        run: node .github/scripts/wait-release-turn.mjs

      # Installation tokens expire after one hour, so mint the write credential
      # only after the potentially long queue wait has completed.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ROSEN_GH_APP_ID }}
          private-key: ${{ secrets.ROSEN_GH_APP_PRIVATE_KEY }}

      - name: Checkout current main with write token
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev

      - name: Install Playwright browsers
        working-directory: backend
        run: poetry run playwright install --with-deps chromium

      - name: Install root npm dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "rosen-archive-bot[bot]"
          git config user.email "rosen-archive-bot[bot]@users.noreply.github.com"

      - name: Materialize SFTP private key (optional, key-auth)
        # Only the backward-compatible SFTP adapter supports key auth. Edgar's
        # FTPS service always uses password auth, so an SFTP key is materialized
        # only when the selected protocol is sftp.
        env:
          ROSEN_TRANSFER_PROTOCOL: ${{ secrets.ROSEN_TRANSFER_PROTOCOL }}
          ROSEN_SFTP_KEY_CONTENT: ${{ secrets.ROSEN_SFTP_KEY_CONTENT }}
        run: |
          protocol="${ROSEN_TRANSFER_PROTOCOL:-sftp}"
          protocol="${protocol,,}"
          protocol="${protocol//[[:space:]]/}"
          if [ "$protocol" = "sftp" ] && [ -n "$ROSEN_SFTP_KEY_CONTENT" ]; then
            umask 077
            printf '%s\n' "$ROSEN_SFTP_KEY_CONTENT" > "$RUNNER_TEMP/rosen_deploy"
            chmod 600 "$RUNNER_TEMP/rosen_deploy"
            echo "ROSEN_SFTP_KEY_PATH=$RUNNER_TEMP/rosen_deploy" >> "$GITHUB_ENV"
            echo "Transfer auth: private key materialized for SFTP."
          else
            echo "Transfer auth: private key not materialized; using password authentication."
          fi

      - name: Process submission
        working-directory: backend
        env:
          # Sheet-controlled inputs — never interpolated into the shell command
          # text; the shell reads them as env vars and our own quoting protects
          # against argument splitting.
          URL: ${{ inputs.url }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          RAW_TEXT: ${{ inputs.raw_text }}
          SHEET_ID: ${{ inputs.sheet_id }}
          SHEET_TAB: ${{ inputs.sheet_tab }}
          SHEET_ROW: ${{ inputs.sheet_row }}
          RETRY_RECORD_ID: ${{ inputs.retry_record_id }}
          # Auth + integration secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROSEN_SHEETS_SA_KEY_JSON: ${{ secrets.ROSEN_SHEETS_SA_KEY_JSON }}
          ROSEN_TRANSFER_PROTOCOL: ${{ secrets.ROSEN_TRANSFER_PROTOCOL }}
          ROSEN_SFTP_HOST: ${{ secrets.ROSEN_SFTP_HOST }}
          ROSEN_SFTP_USER: ${{ secrets.ROSEN_SFTP_USER }}
          ROSEN_SFTP_PASSWORD: ${{ secrets.ROSEN_SFTP_PASSWORD }}
          ROSEN_SFTP_REMOTE_PATH: ${{ secrets.ROSEN_SFTP_REMOTE_PATH }}
          ROSEN_SFTP_PORT: ${{ secrets.ROSEN_SFTP_PORT }}
          # ROSEN_SFTP_KEY_PATH is exported by the "Materialize SFTP private key"
          # step above (via $GITHUB_ENV) when key-auth is enabled. Do not also set
          # it from a secret here: a step-level env entry overrides $GITHUB_ENV, so
          # the usually-empty secret would shadow the materialized runner-temp path
          # and silently fall back to password auth.
          ROSEN_SFTP_KEY_PASSPHRASE: ${{ secrets.ROSEN_SFTP_KEY_PASSPHRASE }}
          ROSEN_SFTP_KNOWN_HOSTS: ${{ secrets.ROSEN_SFTP_KNOWN_HOSTS }}
          # process_submission.py reads these for the git commit identity
          GIT_BOT_NAME: rosen-archive-bot
          GIT_BOT_EMAIL: "rosen-archive-bot[bot]@users.noreply.github.com"
        run: |
          poetry run python scripts/process_submission.py \
            --url "$URL" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --raw-text "$RAW_TEXT" \
            --sheet-id "$SHEET_ID" \
            --sheet-tab "$SHEET_TAB" \
            --sheet-row "$SHEET_ROW" \
            --retry-record-id "$RETRY_RECORD_ID"
