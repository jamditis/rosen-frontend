name: Bluesky stewardship publisher

on:
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Capture and verify without changing main or production'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout release queue helper
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wait for release turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_QUEUE_TIMEOUT_SECONDS: 18000
        run: node .github/scripts/wait-release-turn.mjs

      - name: Refresh protected main after queue wait
        id: refresh
        run: |
          git fetch origin main
          git checkout --detach origin/main
          git lfs pull
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Initialize failure receipt state
        if: always()
        run: node .github/scripts/bluesky-stewardship-publisher.mjs init

      - name: Set up Python 3.13
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python runtime dependency
        if: always()
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      # Mint after the queue and dependency setup so the one-hour installation
      # token covers only the tested publication portion of the run.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ROSEN_GH_APP_ID }}
          private-key: ${{ secrets.ROSEN_GH_APP_PRIVATE_KEY }}

      - name: Checkout tested main with write token
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.refresh.outputs.sha }}
          fetch-depth: 0
          lfs: false

      - name: Install root npm dependencies
        run: npm ci --ignore-scripts

      - name: Capture, test, commit, and push update
        id: prepare
        continue-on-error: true
        run: node .github/scripts/bluesky-stewardship-publisher.mjs prepare

      - name: Deploy exact tested commit
        id: deploy
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.has_changes == 'true' && env.DRY_RUN != 'true'
        working-directory: backend
        env:
          ROSEN_TRANSFER_PROTOCOL: ${{ secrets.ROSEN_TRANSFER_PROTOCOL }}
          ROSEN_SFTP_HOST: ${{ secrets.ROSEN_SFTP_HOST }}
          ROSEN_SFTP_USER: ${{ secrets.ROSEN_SFTP_USER }}
          ROSEN_SFTP_PASSWORD: ${{ secrets.ROSEN_SFTP_PASSWORD }}
          ROSEN_SFTP_SITE_PATH: ${{ secrets.ROSEN_SFTP_SITE_PATH }}
          ROSEN_SFTP_TRANSACTION_PATH: ${{ secrets.ROSEN_SFTP_TRANSACTION_PATH }}
          ROSEN_SFTP_PORT: ${{ secrets.ROSEN_SFTP_PORT }}
        run: python scripts/deploy_full_site.py

      - name: Verify live bytes
        id: verify_live
        if: steps.deploy.outcome == 'success'
        run: node .github/scripts/verify-live-deploy.mjs

      - name: Build final receipt
        id: receipt
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_live.outcome }}
          RECEIPT_DELIVERY_OUTCOME: ${{ steps.send_receipt.outcome }}
        run: node .github/scripts/bluesky-stewardship-publisher.mjs finalize

      - name: Send final receipt
        id: send_receipt
        if: always() && steps.receipt.outcome == 'success'
        env:
          ROSEN_INGESTION_RECEIPT_TOKEN: ${{ secrets.ROSEN_INGESTION_RECEIPT_TOKEN }}
          RECEIPT_PATH: ${{ steps.receipt.outputs.receipt_path }}
        run: python backend/scripts/post_ingestion_receipt.py "$RECEIPT_PATH"

      - name: Create or update failure issue
        if: always() && (steps.receipt.outputs.status == 'failed' || steps.receipt.outcome != 'success' || steps.send_receipt.outcome != 'success')
        uses: actions/github-script@v8
        env:
          ERROR_CLASS: ${{ steps.receipt.outputs.error_class || 'workflow_failed' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const title = 'Automated Bluesky stewardship publication failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Attempt: ${process.env.GITHUB_RUN_ATTEMPT}`,
              `Error class: ${process.env.ERROR_CLASS}`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                labels: ['automation', 'stewardship'], milestone: 13,
              });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['automation', 'stewardship'], milestone: 13,
              });
            }

      - name: Write run summary
        if: always()
        env:
          RECEIPT_STATUS: ${{ steps.receipt.outputs.status || 'failed' }}
          ERROR_CLASS: ${{ steps.receipt.outputs.error_class }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_live.outcome }}
        run: |
          {
            echo '## Bluesky stewardship publisher'
            echo
            echo "- Receipt status: \`$RECEIPT_STATUS\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Prepare: \`$PREPARE_OUTCOME\`"
            echo "- Deploy: \`${DEPLOY_OUTCOME:-skipped}\`"
            echo "- Live byte verification: \`${VERIFY_OUTCOME:-skipped}\`"
            echo "- Receipt delivery: \`${RECEIPT_DELIVERY_OUTCOME:-skipped}\`"
            if [ -n "$ERROR_CLASS" ]; then echo "- Error class: \`$ERROR_CLASS\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail unsuccessful publication
        if: always() && (steps.receipt.outputs.status == 'failed' || steps.receipt.outcome != 'success' || steps.send_receipt.outcome != 'success')
        run: exit 1

