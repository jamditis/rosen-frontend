name: Frontend Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'index.html'
      - 'shared-styles.css'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'index.html'
      - 'shared-styles.css'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript files with node --check..."
          status=0
          while IFS= read -r file; do
            if node --check "$file"; then
              echo "ok: $file"
            else
              echo "::error file=$file::JavaScript syntax error"
              status=1
            fi
          done < <(find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './backend/*' \
            -not -path './archived/*')
          exit $status

      - name: Verify main entry points exist
        run: |
          echo "Verifying main entry points..."
          for f in index.html frontend/index.js frontend/App.js frontend/constants.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "ok: $f"
          done
          for d in frontend/components frontend/services; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing required directory: $d"
              exit 1
            fi
            echo "ok: $d/"
          done

      - name: Run frontend test suite
        run: npm run test:frontend

      - name: Check HTML documents are well-formed
        run: |
          echo "Checking HTML files..."
          for file in $(find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -not -path './backend/*'); do
            if ! grep -q '<html' "$file" && ! grep -q '<!DOCTYPE' "$file"; then
              echo "Warning: $file may not be a complete HTML document"
            fi
          done

      - name: List external CDN references
        run: |
          echo "External CDN references in HTML files:"
          for file in $(find . -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -not -path './backend/*'); do
            grep -oE 'https?://[^"'\''[:space:]]*' "$file" 2>/dev/null \
              | grep -E '(esm\.sh|unpkg\.com|cdn\.)' | sed "s|^|  $file: |" || true
          done

      - name: Check for TODO and FIXME comments
        run: |
          echo "Scanning for TODO/FIXME comments..."
          grep -rn 'TODO\|FIXME' --include='*.js' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=backend --exclude-dir=archived \
            | head -20 || echo "No TODO/FIXME found"
        continue-on-error: true
